<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your sign-in link for GTMath</title>
</head>
<body style="margin:0; padding:0; background:#F4F8FF; font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F8FF; padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%; background:#FFFFFF; border-radius:20px; border:1px solid #E4E4EA; box-shadow:0 18px 40px rgba(11,11,16,0.08);">
          <!-- Header -->
          <tr>
            <td align="center" style="padding:40px 32px 0;">
              <div style="display:inline-block; width:56px; height:56px; background:#0000FF; border-radius:16px; text-align:center; line-height:56px; font-size:30px; box-shadow:0 12px 30px rgba(0,0,255,0.18);">
                &#9889;
              </div>
            </td>
          </tr>
          <!-- Title -->
          <tr>
            <td align="center" style="padding:16px 32px 0;">
              <h1 style="margin:0; font-family:'Archivo','Inter','Segoe UI',system-ui,sans-serif; font-weight:900; font-size:32px; letter-spacing:-0.035em; color:#0B0B10;">
                GTMath<span style="color:#0000FF;">52</span>
              </h1>
            </td>
          </tr>
          <!-- Subtitle -->
          <tr>
            <td align="center" style="padding:8px 32px 0;">
              <p style="margin:0; font-size:15px; color:#4A4A55; line-height:1.5;">
                Tap the button below to sign in to the<br/>parent dashboard and track your child's progress.
              </p>
            </td>
          </tr>
          <!-- Button -->
          <tr>
            <td align="center" style="padding:28px 32px;">
              <a href="{{ .ConfirmationURL }}"
                 target="_blank"
                 style="display:inline-block; padding:16px 40px; background:#0000FF; color:#FFFFFF; font-family:'Archivo','Inter','Segoe UI',system-ui,sans-serif; font-weight:700; font-size:16px; letter-spacing:0.04em; text-transform:uppercase; text-decoration:none; border-radius:999px; box-shadow:0 12px 30px rgba(0,0,255,0.18);">
                Sign in to GTMath52
              </a>
            </td>
          </tr>
          <!-- Divider -->
          <tr>
            <td style="padding:0 32px;">
              <hr style="border:none; border-top:1px solid #E4E4EA; margin:0;" />
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td align="center" style="padding:20px 32px 32px;">
              <p style="margin:0; font-size:13px; color:#6B6B76; line-height:1.5;">
                This link expires in 1 hour. If you didn't request this email, you can safely ignore it.
              </p>
              <p style="margin:10px 0 0; font-size:12px; color:#6B6B76;">
                GTMath by <span style="color:#0000FF; font-weight:600;">Helix Inc.</span>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
